apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-demo-app-java
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VarunJ-eng/aks-demo-gitops-java.git
    targetRevision: main
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
